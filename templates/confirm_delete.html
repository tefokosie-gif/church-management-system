{% extends 'base.html' %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<div class="page-head"><h1>{{ title }}</h1></div>
<div class="card form-card">
  <p>Are you sure you want to delete <strong>{{ object }}</strong>? This cannot be undone.</p>
  <form method="post">
    {% csrf_token %}
    <div class="form-actions">
      <button class="btn danger" type="submit">Yes, delete</button>
      <a class="btn ghost" href="{{ cancel_url }}">Cancel</a>
    </div>
  </form>
</div>
{% endblock %}
