{% extends 'base.html' %}
{% block title %}{{ message.subject }}{% endblock %}
{% block content %}
<div class="page-head"><div><h1>{{ message.subject }}</h1><p class="subtitle">To {{ message.recipient }} · {{ message.sent_at|date:"j F Y, H:i" }}</p></div></div>
<div class="card form-card"><div class="prose">{{ message.content }}</div></div>
<p style="margin-top:1.25rem"><a href="{% url 'communications:list' %}">&larr; Back to messages</a></p>
{% endblock %}
