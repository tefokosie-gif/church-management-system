{% if page_obj.has_other_pages %}
<nav class="pagination" aria-label="Pagination">
  {% if page_obj.has_previous %}<a class="btn small" href="?page={{ page_obj.previous_page_number }}&{{ querystring }}">&larr; Previous</a>{% else %}<span></span>{% endif %}
  <span>Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}<a class="btn small" href="?page={{ page_obj.next_page_number }}&{{ querystring }}">Next &rarr;</a>{% else %}<span></span>{% endif %}
</nav>
{% endif %}
